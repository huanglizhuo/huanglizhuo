<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Huang — Projects</title>
  <meta name="description" content="Huang's personal projects: Echopod, Ketsuin, OctoCounts, and blog." />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --card: #161b22;
      --card-hover: #1c2330;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    main { width: 100%; max-width: 640px; }
    header { margin-bottom: 2.5rem; }
    h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: var(--muted); margin-top: 0.5rem; }
    .projects { display: grid; gap: 0.875rem; list-style: none; }
    a.card {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.125rem 1.25rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    a.card:hover { background: var(--card-hover); border-color: var(--accent); }
    a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .name { font-size: 1.05rem; font-weight: 600; }
    .domain { color: var(--muted); font-size: 0.85rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    a.card:hover .domain { color: var(--accent); }
    footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.8rem; }
    footer a { color: var(--muted); }
    @media (max-width: 480px) {
      a.card { flex-direction: column; gap: 0.25rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Huang</h1>
      <p>Things I build and write.</p>
    </header>
    <ul class="projects">
      <li>
        <a class="card" href="https://echopod.clothpath.com/">
          <span class="name">Echopod</span>
          <span class="domain">echopod.clothpath.com</span>
        </a>
      </li>
      <li>
        <a class="card" href="https://ketsuin.clothpath.com/">
          <span class="name">Ketsuin</span>
          <span class="domain">ketsuin.clothpath.com</span>
        </a>
      </li>
      <li>
        <a class="card" href="https://octocounts.com/">
          <span class="name">OctoCounts</span>
          <span class="domain">octocounts.com</span>
        </a>
      </li>
      <li>
        <a class="card" href="https://blog.clothpath.com/">
          <span class="name">Blog</span>
          <span class="domain">blog.clothpath.com</span>
        </a>
      </li>
    </ul>
    <footer>
      <a href="https://github.com/huanglizhuo">github.com/huanglizhuo</a>
    </footer>
  </main>
</body>
</html>
